[project]
name = "tripadvisor-review-collector"
version = "0.1.0"
requires-python = ">=3.12"
description = "Conservative, resumable Tripadvisor Terra review collector"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
